services:
  postgres:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-consultation_ai}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

    ports:
      - "${POSTGRES_PORT:-5440}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./backend

    # Backend runtime configuration, including AI configuration.
    # backend/.env must NOT be committed.
    env_file:
      - ./backend/.env

    environment:
      # Docker-specific database networking overrides.
      # Inside Docker, PostgreSQL is reached by the Compose service name.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

      # Frontend origin used by backend/CORS configuration.
      FRONTEND_ORIGIN: http://localhost:${FRONTEND_PORT:-3000}

    volumes:
      # Development bind mount:
      # local Python changes are immediately visible in the container.
      - ./backend:/app

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "${BACKEND_PORT:-5000}:5000"


  frontend:
    build:
      context: ./frontend

    environment:
      # This URL is used by the browser, therefore localhost is correct.
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-5000}

    volumes:
      # Development bind mount for Vite HMR.
      - ./frontend:/app

      # Preserve container-installed node_modules instead of hiding it
      # behind the source bind mount.
      - frontend_node_modules:/app/node_modules

    depends_on:
      - backend

    ports:
      - "${FRONTEND_PORT:-3000}:5173"


volumes:
  postgres_data:
  frontend_node_modules:
